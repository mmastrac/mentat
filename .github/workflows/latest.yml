name: latest

# Points latest at a published version. Releases never move it themselves.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to point latest at, such as 0.19.0"
        required: true

permissions:
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGES: mentat-artifacts mentatd mentatd-serve mentat

jobs:
  latest:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Point latest at the version
        env:
          V: ${{ inputs.version }}
        run: |
          case "$V" in
            *[!0-9.]* | "") echo "not a release version: $V" >&2; exit 1 ;;
          esac
          for i in $IMAGES; do
            docker buildx imagetools create -t "$REGISTRY/$i:latest" "$REGISTRY/$i:$V"
            docker buildx imagetools inspect "$REGISTRY/$i:latest" | grep Platform
          done
