name: spec

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Liveness costs far more than safety, so each large liveness check gets a
  # runner of its own and the rest share one.
  tla:
    name: ${{ matrix.name }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Grace liveness
            checks: fixed-grace-liveness
          - name: Claims liveness
            checks: fixed-claims-liveness
          - name: Safety and bug variants
            checks: --except fixed-grace-liveness fixed-claims-liveness
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mentat
          key: tla2tools-1.7.4
      - run: scripts/check-spec ${{ matrix.checks }}
