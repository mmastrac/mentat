name: spec

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tla:
    name: Model-check HeadDaemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mentat
          key: tla2tools-1.7.4
      - run: scripts/check-spec
