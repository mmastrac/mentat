name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: debug
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      # The suites build these too. Building here fills the cache they restore.
      - run: cargo build -p mentatd -p mentatd-serve

  # Each suite gets its own runner. The suites pick free ports and collide
  # when two run on one box.
  suites:
    name: ${{ matrix.suite }}
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - autoconfig
          - e2e_local
          - fabric
          - groups
          - multinode
          - probe
          - serve
          - topology
          - vllm_shape
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: debug
          save-if: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 tests/test_${{ matrix.suite }}.py
