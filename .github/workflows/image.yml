name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  # build.sh runs each binary and checks that it is static, so each
  # architecture builds on a runner of that architecture.
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - run: VERSION=ci DOCKER=docker ./build.sh
      - name: Check the image architecture
        run: |
          want=$(uname -m)
          got=$(docker run --rm mentat-artifacts:ci uname -m)
          echo "runner $want, image $got"
          [ "$want" = "$got" ]
