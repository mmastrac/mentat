name: image

# Every push and pull request builds the images on x86_64 and arm64.
# release.yml calls this with publish set. Each architecture then pushes its
# images to ghcr and hands on their digests, a tarball of the binaries and,
# from amd64, the shim wheel.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "Tag to build, such as v0.19.0"
        type: string
        required: true
      publish:
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGES: mentat-artifacts mentatd mentatd-serve mentat

jobs:
  # build.sh runs each binary and checks that it is static, so each
  # architecture builds on a runner of that architecture.
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: blacksmith-4vcpu-ubuntu-2404
          - arch: arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Pick the image tag
        env:
          REF: ${{ inputs.ref }}
        run: |
          case "$REF" in v*) v=${REF#v} ;; *) v=ci ;; esac
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - run: DOCKER=docker ./build.sh
      - name: Check the image architecture
        run: |
          want=$(uname -m)
          got=$(docker run --rm "mentat-artifacts:$VERSION" uname -m)
          echo "runner $want, image $got"
          [ "$want" = "$got" ]
      - name: Check the tag matches the binaries
        if: inputs.ref != ''
        run: |
          got=$(docker run --rm "mentat-artifacts:$VERSION" /out/mentatd --version)
          echo "tag $VERSION, binary $got"
          [ "$got" = "mentatd $VERSION" ]
      - name: Pack the binaries
        if: inputs.publish
        run: |
          name=mentat_${VERSION}_linux_${{ matrix.arch }}
          mkdir -p "build/$name" dist
          c=$(docker create "mentat-artifacts:$VERSION")
          docker cp "$c:/out/." build/out
          docker rm "$c" > /dev/null
          cp build/out/mentatd build/out/mentatd-serve build/out/mentatd-probe-machine \
            README.md "build/$name/"
          tar -C build -czf "dist/$name.tar.gz" "$name"
          # The wheel is pure Python, so one architecture ships it.
          if [ ${{ matrix.arch }} = amd64 ]; then
            cp build/out/mentatd-*-py3-none-any.whl dist/
          fi
          ls -l dist
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # ghcr cannot drop a tag without deleting the image under it, and the
      # multi-arch tag refers to that image. So each architecture pushes under
      # a staging tag the next release reuses, and release.yml joins the
      # images by digest.
      - name: Push the images
        if: inputs.publish
        run: |
          mkdir -p digests
          for i in $IMAGES; do
            ref=$REGISTRY/$i:staging-${{ matrix.arch }}
            docker tag "$i:$VERSION" "$ref"
            docker push -q "$ref"
            d=$(docker buildx imagetools inspect --raw "$ref" | sha256sum | cut -d' ' -f1)
            echo "$REGISTRY/$i@sha256:$d" > "digests/$i"
          done
          cat digests/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.publish
        with:
          name: build-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/
            digests/
