# mentatd-serve: the cluster's serving front door -- one OpenAI-compatible
# endpoint (routes by model name to whichever group announced it, streaming
# passed through) and one MCP endpoint merging the per-container management
# MCPs (tools prefixed <group>__). A separate process from mentatd on
# purpose: the daemon never touches inference traffic.
#
# Deploy to ~/compose/mentatd-serve/ on whichever box(es) should answer
# clients -- any box works, it only needs to reach every mentatd's HTTP port
# and the announced endpoints. On the pair those are on 10.100.0.x, so a
# front door for a pair-hosted model must run on one of the pair (n3
# cannot reach that subnet).
#
# No .env is required. Daemons are found by their UDP announcements (port
# 6382), by the MENTAT_DAEMONS seed (the local daemon by default; set it
# empty for UDP only), and through the mesh's membership once any one
# daemon is reached. Announcements are unsigned hints: they only add an
# address to watch, and everything a daemon claims is re-read over TCP and
# probed.
#
# Routing is health-gated: a group is admitted only while it has a running
# actor and its announced endpoint answers a /models probe. The MCP merge
# skips the gate: the status server matters most while the engine is loading
# or wedged.
services:
  mentatd-serve:
    image: ${IMAGE:-mentatd-serve:0.2.1}
    container_name: mentatd-serve
    # Host networking: the announced endpoints live on host/cluster
    # addresses (10.100.0.x on the pair) that bridge networking cannot reach.
    network_mode: host
    restart: unless-stopped
    # The HMAC key when it lives in a file. Point MENTAT_SECRET_HOST_FILE at
    # the key on the host and set MENTAT_SECRET_FILE=/run/mentat/secret.
    # Unset, this mounts /dev/null, which reads empty and costs nothing.
    volumes:
      - ${MENTAT_SECRET_HOST_FILE:-/dev/null}:/run/mentat/secret:ro
    environment:
      # The local seed costs nothing beside the UDP path and covers a
      # listener that missed the first announcements. To the bare binary an
      # empty (set) value means no seeds at all; compose cannot express
      # that, since ${VAR:-default} treats empty as unset.
      - MENTAT_DAEMONS=${MENTAT_DAEMONS:-127.0.0.1:6380}
      - SERVE_PORT=${SERVE_PORT:-6381}
      # The daemons' announcement port. 0 turns the listener off.
      - MENTAT_ANNOUNCE_PORT=${MENTAT_ANNOUNCE_PORT:-6382}
      # Empty keeps the built-in default: own subnets, loopback, and the
      # docker bridge ranges (a bridge-networked client like OpenWebUI
      # reaching this host keeps its 172.x source).
      - ALLOWED_SOURCES=${ALLOWED_SOURCES:-}
      # HMAC key for announcements. Set it here and on every daemon, or on
      # neither: a router holding a key accepts signed announcements only.
      - MENTAT_SECRET=${MENTAT_SECRET:-}
      # Set this to /run/mentat/secret to use the mount above. A path
      # that reads empty turns signing off, even with MENTAT_SECRET set.
      - MENTAT_SECRET_FILE=${MENTAT_SECRET_FILE:-}
      # Cluster name. Foreign universes are dropped without a log line.
      - MENTAT_UNIVERSE=${MENTAT_UNIVERSE:-}
      # Empty = 1800s. A non-streaming answer arrives only when generation
      # ends, so this is sized for generation rather than for a hung request.
      - SERVING_TIMEOUT_S=${SERVING_TIMEOUT_S:-}
