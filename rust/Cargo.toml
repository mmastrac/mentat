[package]
name = "mentatd"
version = "0.5.1"
edition = "2021"
description = "Minimal Ray replacement for vLLM multi-node serving"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mmastrac/mentat"
readme = "README.md"
keywords = ["vllm", "ray", "inference", "cluster", "daemon"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
getifaddrs = "0.6"
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[profile.release]
# The binary is COPY'd into two serving images; small and boring beats fast
# here -- the daemon's message rate is a handful per minute.
opt-level = "s"
strip = true
