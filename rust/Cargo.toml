[workspace]
members = ["common", "mentatd", "mentatd-serve"]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mmastrac/mentat"

[workspace.dependencies]
mentat-common = { path = "common", version = "0.9.0" }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
getifaddrs = "0.6"

# Both binaries are COPY'd into serving images, and neither handles more than
# a few messages a minute or a token stream a proxy can carry at any size.
[profile.release]
opt-level = "s"
strip = true
