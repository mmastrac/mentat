# Its own crate so the daemon stays std + serde + clap and only the router
# pays for the async stack its streaming proxy needs.
[package]
name = "mentatd-serve"
description = "OpenAI-compatible router and merged MCP for a mentat cluster"
readme = "../../GUIDE-SERVE.md"
keywords = ["vllm", "inference", "router", "openai", "mcp"]
categories = ["command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
serde_json.workspace = true
getifaddrs.workspace = true
hmac.workspace = true
sha2.workspace = true
