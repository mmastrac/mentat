\* The default model: 2 drivers, 2 devices, 1 daemon restart and a reap
\* grace. scripts/check-spec derives every other check from this file.
SPECIFICATION Spec
CONSTANTS
    Clients = {d1, d2}
    Gpus = {g1, g2}
    MaxPgs = 2
    MaxRestarts = 1
    NoClient = NoClient
    GraceDeferred = TRUE
    BugAccountPgsOnly = FALSE
    BugNoPlaceOnExit = FALSE
    BugNoOrphanReap = FALSE
    BugKillDuringGrace = FALSE
    BugReapReconnected = FALSE
INVARIANTS TypeOK NoDoubleAlloc
PROPERTIES NoStall GraceHoldsActors SessionKeepsActors
